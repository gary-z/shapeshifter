name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check compiler and Clippy warnings
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # Tests compile the library, CLIs, and examples; no separate build job.
      - name: Run native tests
        run: cargo test --release --locked --all-targets --all-features

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Checksum committed packages
        run: find web/pkg web/pkg-threaded -type f \( -name '*.js' -o -name '*.wasm' \) -print0 | sort -z | xargs -0 sha256sum | tee /tmp/wasm-before.sha
      - name: Rebuild packages
        run: ./web/build.sh
      - name: Verify committed packages match rebuild
        run: |
          find web/pkg web/pkg-threaded -type f \( -name '*.js' -o -name '*.wasm' \) -print0 | sort -z | xargs -0 sha256sum | tee /tmp/wasm-after.sha
          if ! diff -q /tmp/wasm-before.sha /tmp/wasm-after.sha > /dev/null 2>&1; then
            echo "::error::Committed WASM files are out of sync with Rust source. Run './web/build.sh' and commit the result."
            diff /tmp/wasm-before.sha /tmp/wasm-after.sha || true
            exit 1
          fi
      - name: Upload mismatched rebuild
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rebuilt-wasm
          path: |
            web/pkg/
            web/pkg-threaded/

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Test Node tooling
        run: npm test
      - name: Test Chromium and Firefox
        run: npm run test:browser
