[package]
name = "shapeshifter"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
rand = "0.10.0"
regex = "1"
rayon = "1.11.0"
rand_mt = { version = "6.0.3", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = { version = "0.2.127", optional = true }
getrandom = { version = "0.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wait-timeout = "0.2.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"], optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.test]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
debug_pruning = []
wasm = ["wasm-bindgen", "getrandom/wasm_js"]
wasm-threads = ["wasm", "dep:wasm-bindgen-rayon"]
